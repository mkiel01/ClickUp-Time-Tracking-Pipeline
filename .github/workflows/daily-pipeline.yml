# Daily: ClickUp sync → Excel export → update Google Sheet
# Self-hosted runner on your Mac — see README “Daily automation”.

name: Daily pipeline

on:
  workflow_dispatch: # Actions → Daily pipeline → Run workflow
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily

env:
  PROJECT_DIR: /Users/michalkielkowski/Desktop/click_up_api

jobs:
  daily:
    name: Sync → export → upload
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
    steps:
      - name: Pull latest code
        run: git pull --ff-only origin main || true

      - name: 1 — ClickUp → Postgres
        run: |
          set -a && source .env && set +a
          arch -arm64 .venv/bin/python tracked_time_update.py --days-back "${SYNC_DAYS_BACK:-2}"

      - name: 2 — Build Excel
        run: |
          set -a && source .env && set +a
          arch -arm64 .venv/bin/python main.py export -o habbit_tracker.xlsx

      - name: 3 — Update Google Sheet
        run: |
          set -a && source .env && set +a
          arch -arm64 .venv/bin/python drive_upload.py habbit_tracker.xlsx


